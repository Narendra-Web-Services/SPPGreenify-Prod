  <style>
    #app-loading {
      position: fixed; inset: 0; z-index: 9999; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
      background: radial-gradient(ellipse at center, #0C2C22 0%, #050D0A 68%);
    }
    .app-loading-glow {
      position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 174, 138, 0.28), transparent 62%);
      animation: appLoadingGlow 2.6s ease-in-out infinite;
    }
    @keyframes appLoadingGlow { 0%, 100% { opacity: 0.5; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.06); } }

    .app-loading-scene { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }
    .app-loading-ring {
      position: absolute; width: 88px; height: 88px; border-radius: 50%;
      border: 1px solid rgba(140, 205, 172, 0.4);
      animation: appLoadingRing 2.6s cubic-bezier(0.25, 0, 0.4, 1) infinite;
    }
    .app-loading-ring:nth-child(2) { animation-delay: 0.87s; }
    .app-loading-ring:nth-child(3) { animation-delay: 1.74s; }
    @keyframes appLoadingRing {
      0%   { transform: scale(0.4); opacity: 0; border-color: rgba(224, 192, 138, 0.55); }
      25%  { opacity: 0.7; }
      100% { transform: scale(2.4); opacity: 0; border-color: rgba(140, 205, 172, 0.15); }
    }

    .app-loading-logo {
      position: relative; z-index: 1; width: 74px; height: auto;
      filter: drop-shadow(0 0 22px rgba(110, 200, 160, 0.55));
      animation: appLoadingDive 2.6s cubic-bezier(0.45, 0, 0.4, 1) infinite;
    }
    @keyframes appLoadingDive {
      0%   { transform: scale(0.55); opacity: 0; }
      18%  { opacity: 1; }
      65%  { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    #app-loading span {
      position: relative; z-index: 1;
      font-family: Georgia, serif; font-weight: 500; font-style: italic;
      font-size: 21px; letter-spacing: 0.03em;
      color: #F8F6F2; opacity: 0.92; animation: appLoadingPulse 2.6s ease-in-out infinite;
    }
    @keyframes appLoadingPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }

    @media (prefers-reduced-motion: reduce) {
      .app-loading-glow, .app-loading-ring, .app-loading-logo, #app-loading span { animation: none; }
      .app-loading-logo { opacity: 1; transform: scale(1); }
      .app-loading-ring { display: none; }
      #app-loading span { opacity: 0.92; }
    }

    /* Dismissal — App.ngAfterViewInit() adds this class once the real page
       has rendered underneath. Kept as a real fade instead of an abrupt
       swap, and only fires after a minimum hold (see the inline script
       below) so the splash always reads as a deliberate brand beat rather
       than a flicker on fast connections. */
    #app-loading.app-loading-exit { animation: appLoadingExit 0.6s ease forwards; pointer-events: none; }
    @keyframes appLoadingExit { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      #app-loading.app-loading-exit { animation: none; opacity: 0; }
    }
  </style>
